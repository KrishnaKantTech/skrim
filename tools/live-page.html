<!doctype html>
<meta charset="utf-8">
<title>SecureShare stage-1</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; }
  button { font: inherit; padding: .4rem .8rem; margin-right: .5rem; }
  pre { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; }
  iframe { width: 300px; height: 60px; border: 1px solid #ccc; }
</style>
<h1>SecureShare — stage 1</h1>
<p>Served over http://127.0.0.1 so the content scripts inject exactly as they do
on a real site (file:// would need "Allow access to file URLs").</p>
<button id="share">Share screen</button>
<button id="tab">Share this tab</button>
<button id="stop">Stop</button>
<pre id="log">idle</pre>
<p>Same-origin child frame (proves <code>all_frames</code>):</p>
<iframe id="frame" src="/frame.html"></iframe>

<script>
// Everything the CDP harness drives lives on window.__ss. The page records the
// call timestamp itself, immediately before getDisplayMedia — measuring it from
// outside would fold the CDP round trip into the number under test.
window.__ss = {
  t0: null,
  stream: null,
  tracks: [],
  error: null,
  state: "idle",

  log(s) {
    document.getElementById("log").textContent = s;
  },

  /** Resolves even if Chrome's picker appears, so the harness never wedges. */
  share(opts, timeoutMs) {
    const constraints = Object.assign({ video: true }, opts || {});
    this.error = null;
    this.state = "calling";
    this.log("calling getDisplayMedia " + JSON.stringify(constraints));

    this.t0 = Date.now();
    const call = navigator.mediaDevices.getDisplayMedia(constraints).then(
      (stream) => {
        this.stream = stream;
        this.tracks = stream.getVideoTracks();
        this.state = "sharing";
        this.log("sharing; tracks=" + this.tracks.length);
        // t1 - t0 is everything the user waits through: the hook holding the
        // picker shut until the bar is down, plus Chrome's own capture setup.
        return {
          ok: true, t0: this.t0, t1: Date.now(),
          readyState: this.tracks.map((t) => t.readyState),
        };
      },
      (err) => {
        this.state = "rejected";
        this.error = (err && err.name) + ": " + (err && err.message);
        this.log("rejected — " + this.error);
        return { ok: false, t0: this.t0, error: this.error };
      },
    );

    const timeout = new Promise((res) =>
      setTimeout(() => res({ ok: false, t0: this.t0, timedOut: true }), timeoutMs || 8000),
    );
    return Promise.race([call, timeout]);
  },

  /** The page ending its own share. stop() fires no `ended` event, by spec. */
  stop() {
    const n = this.tracks.length;
    for (const t of this.tracks) {
      try { t.stop(); } catch (e) { /* already gone */ }
    }
    this.state = "stopped";
    this.log("stopped " + n + " track(s)");
    return { stopped: n, readyState: this.tracks.map((t) => t.readyState) };
  },

  readyState() {
    return this.tracks.map((t) => t.readyState);
  },

  /** What Chrome really says this capture is. Unpatched, straight off the track. */
  settings() {
    return this.tracks.map((t) => (t.getSettings ? t.getSettings().displaySurface : null));
  },

  /**
   * Make every subsequent capture REPORT a chosen displaySurface.
   *
   * --auto-accept-this-tab-capture bypasses Chrome's picker, so every share this
   * harness can start is a tab capture — and the hook correctly hands those back
   * at once, which would make the whole "the bar stays down for the duration"
   * half of the suite unreachable. So the page lies about the surface, and the
   * suite states which lie it is telling.
   *
   * Patched on MediaStreamTrack.prototype, in the page's own world, which is
   * exactly where the hook reads it from. `null` restores Chrome's real answer —
   * and one scenario deliberately uses that to prove the premise this whole
   * feature rests on: that a real tab capture really does say "browser".
   */
  surface(kind) {
    const proto = MediaStreamTrack.prototype;
    if (!this._realGetSettings) this._realGetSettings = proto.getSettings;
    const real = this._realGetSettings;
    if (kind === null) {
      proto.getSettings = real;
      return { displaySurface: "real" };
    }
    proto.getSettings = function () {
      const s = real.apply(this, arguments);
      s.displaySurface = kind;
      return s;
    };
    return { displaySurface: kind };
  },

  /**
   * Invoked straight off the prototype with a bad receiver — the shape an SDK
   * uses to dodge a patch installed on `navigator.mediaDevices` itself. Reports
   * whether it threw or rejected, because those are different hook branches.
   */
  async callViaPrototype() {
    this.t0 = Date.now();
    let p;
    try {
      p = MediaDevices.prototype.getDisplayMedia.call(null, { video: true });
    } catch (err) {
      this.log("threw synchronously — " + err.name);
      return { threw: true, t0: this.t0, error: err.name + ": " + err.message };
    }
    try {
      const stream = await p;
      for (const t of stream.getVideoTracks()) t.stop();
      return { threw: false, rejected: false, t0: this.t0 };
    } catch (err) {
      this.log("rejected — " + err.name);
      return { threw: false, rejected: true, t0: this.t0, error: err.name + ": " + err.message };
    }
  },

  /** What a site sniffing for a patched API would see. */
  hookProbe() {
    const md = navigator.mediaDevices;
    const proto = MediaDevices.prototype;
    const fn = proto.getDisplayMedia;
    const frame = document.getElementById("frame");
    let inFrame = null;
    try {
      inFrame = !!frame.contentWindow.MediaDevices.prototype[Symbol.for("secureshare.hooked")];
    } catch (e) {
      inFrame = "unreachable: " + e.message;
    }
    return {
      typeofFn: typeof fn,
      hooked: proto[Symbol.for("secureshare.hooked")] === true,
      toString: Function.prototype.toString.call(fn),
      name: fn.name,
      length: fn.length,
      onInstance: Object.prototype.hasOwnProperty.call(md, "getDisplayMedia"),
      hookedInFrame: inFrame,
      secureContext: window.isSecureContext,
    };
  },
};

document.getElementById("share").onclick = () => window.__ss.share();
document.getElementById("tab").onclick = () => window.__ss.share({ preferCurrentTab: true });
document.getElementById("stop").onclick = () => window.__ss.stop();
</script>
